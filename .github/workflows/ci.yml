name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run ruff
        run: |
          uv run ruff check wikifuse/ tests/
          uv run ruff format --check wikifuse/ tests/

      - name: Run vulture
        run: uv run vulture wikifuse/ --min-confidence 80

      - name: Run deptry
        run: uv run deptry wikifuse/

      - name: Run pydoclint
        run: uv run pydoclint wikifuse/

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build and check installed CLI
        run: |
          uv build
          uv venv /tmp/wikifuse-installed
          uv pip install --python /tmp/wikifuse-installed/bin/python dist/*.whl
          /tmp/wikifuse-installed/bin/wikifuse --help
